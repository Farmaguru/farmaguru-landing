name: farmaguru-landing CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  integration:
    runs-on: ubuntu-latest
    name: Continous Integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install
      - run: npm run lint
      - run: npm run build --if-present

  build:
    runs-on: ubuntu-latest
    name: Docker Build Push Image
    needs: [integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Loign to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_HERY_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stagin image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.GH_FARMAGURU_USERNAME }}/farmaguru-landing:latest

  deploy:
    runs-on: ubuntu-latest
    name: Continous Deployment
    needs: [build]
    steps:
      - name: Deploy using SSH to Server
        uses: appleboy/ssh-action@master
        with:
          username: ${{ secrets.USERNAME }}
          host: ${{ secrets.HOST }}
          password: ${{ secrets.PASSWORD }}
          script: |
            cd /${{ secrets.USERNAME }}/farmaguru-landing &&
            docker compose down &&
            docker compose pull &&
            docker compose up -d
